name: Render M2M Node Keep-Alive 24/7

on:
  schedule:
    # Despierta el contenedor de Render cada 12 minutos para mantener latencia <35ms 24/7
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping-m2m-node:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Healthcheck & ERC-8004 Agent Card
        run: |
          echo "Pinging Render M2M Node..."
          curl -fsS https://own-adam.onrender.com/healthz
          echo ""
          curl -fsS https://own-adam.onrender.com/.well-known/agent.json | head -n 20
